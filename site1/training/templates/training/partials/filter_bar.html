<div class="cce-filter-bar">
  <form method="get" style="display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-end; width: 100%;">
    {% for filter in filter_fields %}
      <div class="cce-filter-item">
        <label for="filter-{{ filter.name }}">{{ filter.label }}</label>
        {% if filter.options %}
          <select class="cce-select" id="filter-{{ filter.name }}" name="{{ filter.name }}">
            <option value="">{{ filter.placeholder|default:"Tất cả" }}</option>
            {% for opt in filter.options %}
              <option value="{{ opt.value }}" {% if filter.value == opt.value %}selected{% endif %}>{{ opt.label }}</option>
            {% endfor %}
          </select>
        {% elif filter.type == 'date' %}
          <input class="cce-input" type="date" id="filter-{{ filter.name }}" name="{{ filter.name }}" value="{{ filter.value }}">
        {% else %}
          <input class="cce-input" type="text" id="filter-{{ filter.name }}" name="{{ filter.name }}" placeholder="{{ filter.placeholder|default:'' }}" value="{{ filter.value }}">
        {% endif %}
      </div>
    {% endfor %}

    <div class="cce-filter-actions">
      <button class="cce-btn cce-btn-primary" type="submit" style="display:inline-flex; align-items:center; gap:6px;">
        <span class="material-symbols-outlined" style="font-size:16px;" aria-hidden="true">filter_alt</span>
        <span>Áp dụng lọc</span>
      </button>
      <a class="cce-btn cce-btn-secondary cce-btn-reset" href="?" style="display:inline-flex; align-items:center; gap:6px;">
        <span class="material-symbols-outlined" style="font-size:16px;" aria-hidden="true">restart_alt</span>
        <span>Đặt lại</span>
      </a>
      {% if add_url %}
        <a class="cce-btn cce-btn-accent" href="{{ add_url }}" style="margin-left: auto; display:inline-flex; align-items:center; gap:6px;">
          <span class="material-symbols-outlined" style="font-size:16px;" aria-hidden="true">add</span>
          <span>Thêm mới</span>
        </a>
      {% endif %}
    </div>
  </form>
</div>
