{% load ui_components %}
{% if item.url_name %}
  {% url item.url_name as item_url %}
  {% if item_url %}
    <a class="cce-nav-link{% if active_menu == item.key %} is-active active{% endif %}" href="{{ item_url }}"{% if active_menu == item.key %} aria-current="page"{% endif %}>
      <span class="material-symbols-outlined cce-nav-icon" aria-hidden="true">{{ item.key|nav_icon }}</span>
      <span>{{ item.label }}</span>
    </a>
  {% else %}
    <span class="cce-nav-link" aria-disabled="true" style="opacity: 0.5; cursor: not-allowed;">
      <span class="material-symbols-outlined cce-nav-icon" aria-hidden="true">{{ item.key|nav_icon }}</span>
      <span>{{ item.label }}</span>
    </span>
  {% endif %}
{% else %}
  <span class="cce-nav-link" aria-disabled="true" style="opacity: 0.5; cursor: not-allowed;">
    <span class="material-symbols-outlined cce-nav-icon" aria-hidden="true">{{ item.key|nav_icon }}</span>
    <span>{{ item.label }}</span>
  </span>
{% endif %}
