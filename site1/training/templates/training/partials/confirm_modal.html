<div class="cce-modal-backdrop" id="{{ modal_id }}" role="dialog" aria-modal="true" aria-labelledby="{{ modal_id }}-title">
  <div class="cce-modal-dialog">
    <div class="cce-modal-header">
      <h3 class="cce-modal-title" id="{{ modal_id }}-title">{{ modal_title|default:"Xác nhận thao tác" }}</h3>
      <button type="button" class="cce-btn cce-btn-secondary cce-btn-sm" onclick="document.getElementById('{{ modal_id }}').classList.remove('is-open')" aria-label="Đóng">&times;</button>
    </div>

    <form method="post" action="{{ confirm_action|default:'' }}">
      {% csrf_token %}
      <div class="cce-modal-body">
        <p style="margin-bottom: var(--space-4); color: var(--c-text);">{{ modal_message }}</p>

        {% if reason_required %}
          <div class="cce-form-group">
            <label class="cce-label" for="{{ modal_id }}-reason">
              Lý do thực hiện <span class="cce-required" aria-hidden="true">*</span>
            </label>
            <textarea
              class="cce-textarea"
              id="{{ modal_id }}-reason"
              name="reason"
              rows="3"
              required
              placeholder="Vui lòng nhập lý do bắt buộc trước khi xác nhận..."
            ></textarea>
            <div class="cce-form-help">Thao tác này được ghi nhận vào nhật ký hệ thống để đối soát.</div>
          </div>
        {% endif %}
      </div>

      <div class="cce-modal-footer">
        <button type="button" class="cce-btn cce-btn-secondary" onclick="document.getElementById('{{ modal_id }}').classList.remove('is-open')">Hủy bỏ</button>
        <button type="submit" class="cce-btn cce-btn-danger">{{ confirm_label|default:"Xác nhận" }}</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Enable toggle for this modal
  document.querySelectorAll('[data-bs-target="#{{ modal_id }}"], [data-target="#{{ modal_id }}"]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      const modal = document.getElementById('{{ modal_id }}');
      if (modal) {
        modal.classList.add('is-open');
        const reasonInput = modal.querySelector('textarea[name="reason"]');
        if (reasonInput) reasonInput.focus();
      }
    });
  });
</script>
